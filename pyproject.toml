[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfq-reset-research"
version = "1.0.0"
description = "Self-financing RFQ simulation and cost-aware inventory control"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[tool.setuptools.packages.find]
include = ["resetmm*", "submission*"]
